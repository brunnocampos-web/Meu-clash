<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale: Batalha de Turmas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arena">
        <div class="torre rival">
            🏫 Diretoria Rival <br>
            <span id="hp-rival">HP: 1000</span>
        </div>
        
        <div class="campo" id="campo"></div>
        
        <div class="torre jogador">
            🎒 Sua Turma <br>
            <span id="hp-jogador">HP: 1000</span>
        </div>

        <div class="elixir-bar">
            ⚡ Elixir Escolar: <span id="elixir">5</span> / 10
        </div>

        <p class="historico" id="historico">O sinal tocou! A batalha começou.</p>
        
        <div class="painel-cartas" id="painel-cartas"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
